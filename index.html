<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>超腦防線：算術神射手 (沉浸式升級版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@500;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            tech: ['Orbitron', 'sans-serif'],
            math: ['Chakra Petch', 'monospace'],
            sans: ['Noto Sans TC', 'sans-serif'],
          },
          colors: {
            cyber: {
              dark: '#030712',
              panel: '#0B132B',
              border: '#1C2541',
              neon: '#00F0FF',
              pink: '#FF007F',
              gold: '#FFD700',
              green: '#00FFA3',
              purple: '#9D4EDD'
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #030712;
      color: #E2E8F0;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
    }
    .font-hud {
      font-family: 'Orbitron', sans-serif;
    }
    .font-math {
      font-family: 'Chakra Petch', monospace;
    }
    
    /* 📱 手機直式模式 (S24 風格專用九宮格與自適應) */
    .mobile-mode #game-container {
      max-width: 440px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
      border-left: 1px solid rgba(0, 240, 255, 0.2);
      border-right: 1px solid rgba(0, 240, 255, 0.2);
    }
    .mobile-mode #desktop-keypad {
      display: none !important;
    }
    .mobile-mode #mobile-keypad {
      display: grid !important;
    }
    .mobile-mode footer {
      margin-bottom: 0.5rem !important;
      padding-top: 0.25rem !important;
      padding-bottom: 0.5rem !important;
    }
    .mobile-mode #top-fullscreen-btn {
      display: none !important;
    }
    .mobile-mode .hud-btn-text {
      display: none !important;
    }
    .mobile-mode .hud-health-bar {
      width: 42px !important;
    }
    .mobile-mode #core-label-text {
      display: none !important;
    }
    .mobile-mode header {
      padding-left: 4px !important;
      padding-right: 4px !important;
    }

    /* 💻 平板 / 電腦模式 (維持原版橫向開闊) */
    body:not(.mobile-mode) #mobile-keypad {
      display: none !important;
    }
    body:not(.mobile-mode) #desktop-keypad {
      display: flex !important;
    }
    body:not(.mobile-mode) #open-drawer-tab {
      display: none;
    }

    /* 抽屜自定義動畫樣式 */
    #left-settings-drawer {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
    #left-settings-drawer.hidden {
      display: none !important;
    }

    /* 霓虹發光特效 */
    .glow-cyan {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .glow-pink {
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }
    .glow-gold {
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
    .glow-text-cyan {
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    }

    /* 水印特效 */
    .watermark-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.035);
      z-index: 5;
      white-space: nowrap;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="w-full h-[100dvh] bg-slate-950 flex flex-col items-center justify-center p-0 m-0 overflow-hidden">

  <!-- 遊戲主體容器 -->
  <div id="game-container" class="relative w-full h-full flex flex-col bg-slate-900 border-slate-800 overflow-hidden">
    
    <!-- 戰場中央浮水印 -->
    <div class="watermark-text select-none">B300 製作</div>

    <!-- 頂部 HUD 狀態列 -->
    <header class="relative z-20 w-full flex items-center justify-between px-2 sm:px-4 py-1.5 bg-slate-950/90 backdrop-blur-md border-b border-cyan-500/30 text-xs shrink-0 select-none overflow-hidden">
      <div class="flex items-center gap-1 sm:gap-2.5 shrink-0">
        <!-- 基地血量 -->
        <div class="flex items-center gap-1">
          <span class="text-cyan-400 font-bold font-hud text-[11px]">🛡️<span id="core-label-text" class="ml-0.5">CORE</span></span>
          <div class="hud-health-bar w-14 sm:w-28 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700 shrink-0">
            <div id="hp-bar-fill" class="h-full bg-gradient-to-r from-cyan-500 to-emerald-400 w-full transition-all duration-300"></div>
          </div>
          <span id="hp-text" class="text-[10px] font-math text-cyan-300 whitespace-nowrap">100/100</span>
        </div>
        <!-- 波次資訊 -->
        <div class="bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-700 flex items-center gap-0.5 shrink-0">
          <span class="text-slate-400 text-[9px]">W</span>
          <span id="wave-num-text" class="font-hud text-amber-400 font-bold text-[11px]">1</span>
        </div>
      </div>

      <!-- 貨幣與功能按鈕 -->
      <div class="flex items-center gap-1 sm:gap-2 shrink-0">
        <div class="flex items-center gap-0.5 bg-amber-500/10 border border-amber-500/30 px-1.5 py-0.5 rounded text-amber-300 font-math font-bold text-[11px]" title="當前金幣">
          <span>🪙</span>
          <span id="gold-text">0</span>
        </div>
        <div class="flex items-center gap-0.5 bg-purple-500/10 border border-purple-500/30 px-1.5 py-0.5 rounded text-purple-300 font-math font-bold text-[11px]" title="神經突觸">
          <span>🧠</span>
          <span id="synapse-text">0</span>
        </div>
        <div class="flex items-center gap-0.5 bg-rose-500/10 border border-rose-500/30 px-1.5 py-0.5 rounded text-rose-300 font-math font-bold text-[11px]" title="總攻擊力加成">
          <span>⚔️</span>
          <span id="atk-bonus-text">+0%</span>
        </div>

        <!-- 科技樹按鈕 -->
        <button id="open-tech-btn" class="bg-cyan-900/60 hover:bg-cyan-700/80 text-cyan-200 border border-cyan-400/50 px-2 py-1 rounded flex items-center gap-1 font-hud active:scale-95 transition">
          <span>🧬</span><span class="hud-btn-text">科技</span>
        </button>
        <!-- 軍火商按鈕 -->
        <button id="open-shop-btn" class="bg-purple-900/60 hover:bg-purple-700/80 text-purple-200 border border-purple-400/50 px-2 py-1 rounded flex items-center gap-1 font-hud active:scale-95 transition">
          <span>🛒</span><span class="hud-btn-text">軍火</span>
        </button>
        <!-- BGM 切換按鈕 -->
        <button id="bgm-toggle-btn" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-600 px-2 py-1 rounded flex items-center gap-1 active:scale-95 transition" title="音樂開關">
          <span id="bgm-icon">🎵</span><span class="hud-btn-text" id="bgm-btn-text">ON</span>
        </button>
        <!-- 全螢幕按鈕 (電腦版) -->
        <button id="top-fullscreen-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-2 py-1 rounded flex items-center gap-1 active:scale-95 transition" title="切換全螢幕">
          <span>⛶</span><span class="hud-btn-text">全螢幕</span>
        </button>
      </div>
    </header>

    <!-- 中間戰場主畫布 -->
    <main class="relative flex-1 w-full min-h-0 bg-transparent overflow-hidden">
      <canvas id="game-canvas" class="w-full h-full block cursor-crosshair"></canvas>

      <!-- 左側難度/題型抽屜標籤 -->
      <div id="drawer-container" class="absolute left-0 top-3 z-40 flex items-start">
        <div id="left-settings-drawer" class="transition-all duration-200 bg-slate-900/95 backdrop-blur-md p-2.5 sm:p-3 rounded-r-xl border border-l-0 border-cyan-500/50 shadow-2xl flex flex-col gap-2 min-w-[150px] sm:min-w-[160px]">
          <div class="flex items-center justify-between pb-1 border-b border-slate-800">
            <span class="text-xs font-hud text-cyan-300 font-bold">題型練習範疇</span>
            <button id="close-drawer-x" class="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-slate-800 active:bg-slate-700">✕ 關閉</button>
          </div>
          <div class="grid grid-cols-2 gap-1">
            <button id="op-btn-add" class="px-2 py-1 rounded text-xs font-bold font-math transition bg-cyan-600 text-white border border-cyan-400" data-op="+">➕ 加法</button>
            <button id="op-btn-sub" class="px-2 py-1 rounded text-xs font-bold font-math transition bg-cyan-600 text-white border border-cyan-400" data-op="-">➖ 減法</button>
            <button id="op-btn-mul" class="px-2 py-1 rounded text-xs font-bold font-math transition bg-cyan-600 text-white border border-cyan-400" data-op="*">✖️ 乘法</button>
            <button id="op-btn-div" class="px-2 py-1 rounded text-xs font-bold font-math transition bg-cyan-600 text-white border border-cyan-400" data-op="/">➗ 除法</button>
          </div>
          <span id="op-warning-msg" class="text-[10px] text-amber-300 text-center hidden font-math">至少保留 1 種運算</span>
          <button id="adult-mode-btn" class="w-full py-1 rounded-lg text-xs font-bold font-hud transition flex items-center justify-center gap-1.5 bg-slate-800 text-slate-400 border border-slate-700">
            <span>🔥</span> <span id="adult-mode-text">大人模式 (速+50%)</span>
          </button>
        </div>
        <!-- 展開標籤按鈕 -->
        <button id="open-drawer-tab" class="hidden bg-slate-900/95 hover:bg-slate-800 text-cyan-300 border border-cyan-500/60 border-l-0 px-2 py-3 rounded-r-lg font-hud text-xs flex flex-col items-center justify-center shadow-2xl active:scale-95 cursor-pointer z-40" style="writing-mode: vertical-rl;">
          <span>▶ 難度設定</span>
        </button>
      </div>

      <!-- 右側戰術技能按鈕區 -->
      <div class="absolute right-2.5 bottom-3 z-30 flex flex-col gap-2">
        <button id="skill-freeze-btn" class="relative group w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-slate-900/90 border border-cyan-400/60 shadow-lg flex flex-col items-center justify-center text-cyan-300 active:scale-95 transition">
          <span class="text-base sm:text-lg">⏳</span>
          <span class="text-[9px] font-hud font-bold">凝滯</span>
          <div id="freeze-cd-overlay" class="absolute inset-0 bg-slate-950/80 rounded-xl hidden items-center justify-center text-[10px] font-math text-cyan-400 font-bold">0s</div>
        </button>
        <button id="skill-emp-btn" class="relative group w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-slate-900/90 border border-amber-400/60 shadow-lg flex flex-col items-center justify-center text-amber-300 active:scale-95 transition">
          <span class="text-base sm:text-lg">⚡</span>
          <span class="text-[9px] font-hud font-bold">EMP</span>
          <div id="emp-cd-overlay" class="absolute inset-0 bg-slate-950/80 rounded-xl hidden items-center justify-center text-[10px] font-math text-amber-400 font-bold">0s</div>
        </button>
      </div>
    </main>

    <!-- 底部終端機 (問題與輸入控制台) -->
    <footer class="relative z-30 shrink-0 w-full px-2 sm:px-4 pt-1.5 pb-2 mb-2 sm:mb-6 bg-slate-950/95 backdrop-blur-lg border-t border-cyan-500/40 select-none flex flex-col items-center max-w-4xl mx-auto rounded-t-2xl sm:rounded-2xl shadow-[0_-5px_25px_rgba(0,240,255,0.15)]">
      
      <!-- 武器選擇水平列表 -->
      <div id="weapon-bar" class="w-full flex items-center justify-center gap-1 sm:gap-2 mb-1.5 overflow-x-auto no-scrollbar py-0.5">
        <!-- JS 動態生成武器按鈕 -->
      </div>

      <!-- 核心算術展示列 -->
      <div class="w-full flex items-center justify-between gap-1.5 sm:gap-3 mb-1.5 max-w-md">
        <!-- 語音答題按鈕 -->
        <button id="voice-input-btn" class="px-2 py-1.5 rounded-lg border border-cyan-500/50 bg-slate-900 text-cyan-300 hover:bg-cyan-900/40 active:scale-95 transition flex items-center gap-1 text-xs shrink-0" title="點擊啟用語音辨識作答">
          <span id="voice-icon">🎙️</span>
          <span class="text-[10px] font-hud hidden sm:inline" id="voice-status-text">語音</span>
        </button>

        <!-- 算式展示框 -->
        <div class="flex-1 bg-slate-900/90 border-2 border-cyan-400 rounded-xl px-2 sm:px-3 py-1 flex items-center justify-center shadow-[0_0_12px_rgba(0,240,255,0.25)] min-h-[40px]">
          <span id="question-text" class="text-xl sm:text-2xl font-bold font-math text-yellow-300 tracking-wider">7 × 8 = ?</span>
        </div>

        <!-- 輸入數值展示框 -->
        <div class="w-20 sm:w-24 bg-slate-900/90 border-2 border-emerald-400 rounded-xl px-2 py-1 flex items-center justify-center min-h-[40px] shadow-[0_0_12px_rgba(0,255,163,0.25)]">
          <span id="input-buffer-text" class="text-xl sm:text-2xl font-bold font-math text-emerald-300"></span>
          <span class="animate-pulse text-emerald-400 text-lg">|</span>
        </div>
      </div>

      <!-- 💻 1. 平板 / 電腦版鍵盤 -->
      <div id="desktop-keypad" class="w-full flex items-center justify-center gap-1 sm:gap-1.5 max-w-lg">
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="1">1</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="2">2</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="3">3</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="4">4</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="5">5</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="6">6</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="7">7</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="8">8</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="9">9</button>
        <button class="num-key w-9 sm:w-11 h-9 sm:h-11 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 text-cyan-200 font-math text-base sm:text-lg font-bold border border-slate-700 transition" data-num="0">0</button>
        <button id="backspace-btn" class="px-2.5 h-9 sm:h-11 rounded-lg bg-red-950/80 hover:bg-red-800 text-red-300 font-math text-sm font-bold border border-red-700/60 active:scale-95 transition">⌫</button>
        <button id="fire-action-btn" class="px-3.5 h-9 sm:h-11 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-hud text-xs sm:text-sm font-bold border border-cyan-400 glow-cyan active:scale-95 transition">發射↵</button>
      </div>

      <!-- 📱 2. 手機直式專用計算機九宮格 -->
      <div id="mobile-keypad" class="w-full grid-cols-3 gap-1.5 max-w-xs mx-auto">
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="1">1</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="2">2</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="3">3</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="4">4</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="5">5</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="6">6</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="7">7</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="8">8</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="9">9</button>
        <button id="mobile-backspace-btn" class="h-10 rounded-lg bg-red-950/90 active:bg-red-800 text-red-300 font-math text-base font-bold border border-red-700/60 active:scale-95 transition flex items-center justify-center">⌫</button>
        <button class="num-key h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-cyan-200 font-math text-xl font-bold border border-slate-700 active:scale-95 transition flex items-center justify-center" data-num="0">0</button>
        <button id="mobile-fire-btn" class="h-10 rounded-lg bg-cyan-600 active:bg-cyan-500 text-white font-hud text-sm font-bold border border-cyan-400 glow-cyan active:scale-95 transition flex items-center justify-center">發射↵</button>
      </div>
    </footer>

    <!-- 遊戲起始頁面 (雙版本入口選擇) -->
    <div id="start-screen-overlay" class="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex flex-col items-center justify-center p-4">
      <div class="text-center max-w-md w-full border border-cyan-500/40 rounded-2xl p-6 bg-slate-900/90 shadow-[0_0_40px_rgba(0,240,255,0.25)]">
        <h1 class="text-2xl sm:text-3xl font-black font-hud text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-indigo-400 mb-2">超腦防線：算術神射手</h1>
        <p class="text-slate-400 text-xs sm:text-sm mb-6 font-sans">心算即砲火！動態戰場事件、連擊狂熱與Rogue-lite進化全面升級！</p>
        
        <!-- 雙模式選擇按鈕 -->
        <div class="flex flex-col gap-3">
          <button id="start-mobile-btn" class="w-full py-3.5 px-4 rounded-xl font-hud font-bold text-sm bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
            <span>📱</span>
            <span>手機直式版 (S24 九宮格)</span>
          </button>
          <button id="start-desktop-btn" class="w-full py-3.5 px-4 rounded-xl font-hud font-bold text-sm bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-lg glow-cyan active:scale-95 transition flex items-center justify-center gap-2">
            <span>💻</span>
            <span>平板 / 電腦版 (橫向旗艦版)</span>
          </button>
        </div>

        <div class="mt-5 text-[11px] text-slate-500 flex items-center justify-center gap-2">

    /* ==========================================
       1. 全域音效引擎 (Web Audio API Synthesizer)
       ========================================== */
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.masterVolume = 0.7;
        this.unlocked = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().then(() => { this.unlocked = true; }).catch(() => {});
        } else if (this.ctx) {
          this.unlocked = true;
        }
      }

      playLaser(freq = 600) {
        if (!this.ctx || !this.unlocked) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2 * this.masterVolume, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.13);
        } catch(e) {}
      }

      playShotgun() {
        if (!this.ctx || !this.unlocked) return;
        try {
          for (let i = 0; i < 3; i++) {
            setTimeout(() => this.playLaser(750 - i * 120), i * 15);
          }
        } catch(e) {}
      }

      playExplosion() {
        if (!this.ctx || !this.unlocked) return;
        try {
          const bufSize = this.ctx.sampleRate * 0.25;
          const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buf;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, this.ctx.currentTime);
          filter.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.25);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.35 * this.masterVolume, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e) {}
      }

      playCorrect() {
        if (!this.ctx || !this.unlocked) return;
        try {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.04);
            gain.gain.setValueAtTime(0.2 * this.masterVolume, this.ctx.currentTime + idx * 0.04);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.04 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.04);
            osc.stop(this.ctx.currentTime + idx * 0.04 + 0.13);
          });
        } catch(e) {}
      }

      playWrong() {
        if (!this.ctx || !this.unlocked) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.3 * this.masterVolume, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.19);
        } catch(e) {}
      }

      playSkill(type = 'freeze') {
        if (!this.ctx || !this.unlocked) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type === 'freeze' ? 'sine' : 'sawtooth';
          osc.frequency.setValueAtTime(type === 'freeze' ? 900 : 250, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(type === 'freeze' ? 220 : 1200, this.ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.25 * this.masterVolume, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.36);
        } catch(e) {}
      }
    }

    /* ==========================================
       2. 緊湊多軌 Arcade 街機戰鬥 BGM 引擎
       ========================================== */
    class ArcadeBGM {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.timer = null;
        this.step = 0;
        this.bpm = 136;
        this.isBoss = false;
        this.isAdult = false;
        this.chordProgression = [
          { bass: 55, leadRoot: 220 },
          { bass: 43.65, leadRoot: 174.61 },
          { bass: 65.41, leadRoot: 261.63 },
          { bass: 49, leadRoot: 196 }
        ];
      }

      init(ctx) { this.ctx = ctx; }

      start() {
        if (this.isPlaying || !this.ctx) return;
        this.isPlaying = true;
        this.step = 0;
        this.scheduleNextTick();
      }

      stop() {
        this.isPlaying = false;
        if (this.timer) { clearTimeout(this.timer); this.timer = null; }
      }

      setIntensity(isBoss, isAdult) {
        this.isBoss = isBoss;
        this.isAdult = isAdult;
        this.bpm = (this.isBoss || this.isAdult) ? 154 : 136;
      }

      scheduleNextTick() {
        if (!this.isPlaying || !this.ctx) return;
        const secondsPerBeat = 60.0 / this.bpm;
        const secondsPer16th = secondsPerBeat / 4;
        this.playStep(this.ctx.currentTime, this.step);
        this.step = (this.step + 1) % 64;
        this.timer = setTimeout(() => this.scheduleNextTick(), secondsPer16th * 1000);
      }

      playStep(t, step) {
        if (!this.ctx) return;
        const currentChord = this.chordProgression[Math.floor(step / 16)];
        const subStep = step % 16;

        if (subStep % 4 === 0 || ((this.isBoss || this.isAdult) && subStep === 14)) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(130, t);
          osc.frequency.exponentialRampToValueAtTime(35, t + 0.1);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.11);
        }

        if (subStep === 4 || subStep === 12) {
          const bufSize = this.ctx.sampleRate * 0.08;
          const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buf;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.08);
          noise.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(t);
        }

        if (subStep % 2 === 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(7000, t);
          gain.gain.setValueAtTime(0.04, t);
          gain.gain.linearRampToValueAtTime(0.001, t + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.035);
        }
      }
    }

      const allUnlocked = unlockedCount === WEAPONS.length;

      const goldBonusPct = goldStacks * 5;

      const perkGoldStacks = activePerks['gold_bomb'] ? Math.floor(gold / 50) * 10 : 0;
      const perkBonusPct = (activePerks['gold_bomb'] ? activePerks['gold_bomb'] * perkGoldStacks : 0);

      const totalBonusPct = gunBonusPct + goldBonusPct + perkBonusPct;
      const multiplier = 1 + (totalBonusPct / 100);

      return { unlockedCount, extraGuns, gunBonusPct, allUnlocked, goldStacks, goldBonusPct, perkBonusPct, totalBonusPct, multiplier };
    }

      } else {
        document.body.classList.remove('mobile-mode');
        leftSettingsDrawer.classList.remove('hidden');
        openDrawerTab.classList.add('hidden');
        openDrawerTab.style.display = 'none';
      }
      setTimeout(resizeCanvas, 50);
    }

    /* ==========================================
       7. 左側難度抽屜與題型開關控制
       ========================================== */
    function setupDrawer() {
      const openDrawer = (e) => { if (e) e.stopPropagation(); sound.init(); leftSettingsDrawer.classList.remove('hidden'); openDrawerTab.classList.add('hidden'); openDrawerTab.style.display = 'none'; };

      openDrawerTab.addEventListener('click', openDrawer);
      openDrawerTab.addEventListener('touchstart', (e) => { e.preventDefault(); openDrawer(e); }, { passive: false });
      closeDrawerX.addEventListener('click', closeDrawer);
      closeDrawerX.addEventListener('touchstart', (e) => { e.preventDefault(); closeDrawer(e); }, { passive: false });

      const opBtns = [
        document.getElementById('op-btn-add'),
        document.getElementById('op-btn-sub'),
        document.getElementById('op-btn-mul'),
        document.getElementById('op-btn-div')
      ];

      opBtns.forEach(btn => {
        if (!btn) return;
        btn.addEventListener('click', () => {
          sound.init();
          const op = btn.dataset.op;
          if (allowedOps.includes(op)) {
            if (allowedOps.length <= 1) {
              opWarningMsg.classList.remove('hidden');
              setTimeout(() => opWarningMsg.classList.add('hidden'), 1800);
              return;
            }
            allowedOps = allowedOps.filter(item => item !== op);
            btn.className = 'px-2 py-1 rounded text-xs font-bold font-math transition bg-slate-800 text-slate-400 border border-slate-700';
          } else {
            allowedOps.push(op);
            btn.className = 'px-2 py-1 rounded text-xs font-bold font-math transition bg-cyan-600 text-white border border-cyan-400';
          }
          generateNewQuestion();
        });
      });

      adultModeBtn.addEventListener('click', () => {
        sound.init();
        isAdultMode = !isAdultMode;
        bgm.setIntensity(false, isAdultMode);
        if (isAdultMode) {
          adultModeBtn.className = 'w-full py-1 rounded-lg text-xs font-bold font-hud transition flex items-center justify-center gap-1.5 bg-rose-600 text-white border border-rose-400 glow-pink';
          showFloatingText('ADULT MODE: SPEED +50%!', canvas.width / (2 * (window.devicePixelRatio || 1)), 120, '#FF007F');
        } else {
          adultModeBtn.className = 'w-full py-1 rounded-lg text-xs font-bold font-hud transition flex items-center justify-center gap-1.5 bg-slate-800 text-slate-400 border border-slate-700';
        }
      });
    }

    /* ==========================================
       8. 算術題目生成引擎
       ========================================== */
    function generateNewQuestion() {
      const op = allowedOps[Math.floor(Math.random() * allowedOps.length)] || '+';
      let a = 1, b = 1, ans = 2, symbol = '+';

      if (op === '+') {
        a = Math.floor(Math.random() * 15) + 2; b = Math.floor(Math.random() * 15) + 2; ans = a + b; symbol = '+';
      } else if (op === '-') {
        a = Math.floor(Math.random() * 18) + 5; b = Math.floor(Math.random() * a) + 1; ans = a - b; symbol = '−';
      } else if (op === '*') {
        a = Math.floor(Math.random() * 8) + 2; b = Math.floor(Math.random() * 8) + 2; ans = a * b; symbol = '×';
      } else if (op === '/') {
        b = Math.floor(Math.random() * 8) + 2; ans = Math.floor(Math.random() * 8) + 2; a = b * ans; symbol = '÷';
      }

      // 若觸發電磁風暴 (EMP Storm)，題目變成未知數 (如 7 * ? = 56)
      if (activeMiniEvent === 'emp_storm') {
        if (Math.random() < 0.5) {
          activeQuestion = { a: '?', b, op, ans, hidden: 'a', trueVal: a };
          questionText.textContent = `? ${symbol} ${b} = ${ans}`;
        } else {
          activeQuestion = { a, b: '?', op, ans, hidden: 'b', trueVal: b };
          questionText.textContent = `${a} ${symbol} ? = ${ans}`;
        }
      } else {
        activeQuestion = { a, b, op, ans };
        questionText.textContent = `${a} ${symbol} ${b} = ?`;
      }

      inputBuffer = '';
      inputBufferText.textContent = '';
    }

    /* ==========================================
       9. 輸入管理與砲火發射
       ========================================== */
    function getPrimaryTarget(startX, startY) {
      if (enemies.length === 0) return null;
      let bestTarget = enemies[0];
      let maxScore = -Infinity;
      for (const e of enemies) {
        const score = e.y * 2 - Math.abs(e.x - startX) * 0.15;
        if (score > maxScore) { maxScore = score; bestTarget = e; }
      }
      return bestTarget;
    }

    function handleNumInput(num) {
      sound.init();
      if (inputBuffer.length < 4) { inputBuffer += num; inputBufferText.textContent = inputBuffer; }
    }

    function handleBackspace() {
      sound.init();
      if (inputBuffer.length > 0) { inputBuffer = inputBuffer.slice(0, -1); inputBufferText.textContent = inputBuffer; }
    }

    function handleFire() {
      sound.init();
      if (!inputBuffer) return;
      const userVal = parseInt(inputBuffer, 10);
      const targetAns = activeQuestion.hidden ? activeQuestion.trueVal : activeQuestion.ans;

      if (userVal === targetAns) {
        sound.playCorrect();
        totalCorrect++;
        streakCount++;
        
        let goldEarned = Math.floor(15 * (1 + (TECHS.find(t=>t.id==='gold_mult')?.level||0)*0.2));
        if (activeMiniEvent === 'emp_storm') goldEarned *= 2;
        gold += goldEarned;
        synapse += 1;

        // 吸血晶片觸發
        if (activePerks['vampire'] && Math.random() < 0.20) {
          hp = Math.min(maxHp, hp + 5);
          showFloatingText('VAMPIRE +5 HP', canvas.width / (2 * (window.devicePixelRatio||1)), canvas.height / (window.devicePixelRatio||1) - 100, '#00FFA3');
        }

        if (totalCorrect % 5 === 0) {
          triggerWaveCompletion();
        }
        updateHUD();
        triggerWeaponFire();

        if (streakCount >= 3) {
          showFloatingText(`⚡ STREAK X${streakCount}!`, canvas.width / (2 * (window.devicePixelRatio||1)), canvas.height / (window.devicePixelRatio||1) - 80, '#FFD700');
        } else {
          showFloatingText('EXCELLENT!', canvas.width / (2 * (window.devicePixelRatio||1)), canvas.height / (window.devicePixelRatio||1) - 80, '#00FFA3');
        }
        generateNewQuestion();
      } else {
        sound.playWrong();
        streakCount = 0;
        showFloatingText('MISS!', canvas.width / (2 * (window.devicePixelRatio||1)), canvas.height / (window.devicePixelRatio||1) - 80, '#FF007F');
        inputBuffer = '';
        inputBufferText.textContent = '';
      }
    }

    function triggerWeaponFire() {
      const cw = canvas.width / (window.devicePixelRatio || 1);
      const ch = canvas.height / (window.devicePixelRatio || 1);
      const startX = cw / 2;
      const startY = ch - 22;

      const wp = WEAPONS.find(w => w.id === currentWeaponId) || WEAPONS[0];
      const target = getPrimaryTarget(startX, startY);

      let aimAngle = -Math.PI / 2;
      if (target) {
        aimAngle = Math.atan2(target.y - startY, target.x - startX);
        turretAngle = aimAngle;
      }

      const speedTech = TECHS.find(t => t.id === 'bullet_speed')?.level || 0;
      const spdMult = 1 + speedTech * 0.2;
      const critTech = TECHS.find(t => t.id === 'crit_rate')?.level || 0;
      const isCrit = Math.random() < (0.05 + critTech * 0.1);
      const atkStats = getAttackStats();
      let dmgMult = (isCrit ? 2.5 : 1) * atkStats.multiplier;

      // 若達成連擊狂熱 (Streak Fever) 且擁有晶片，傷害加倍
      if (streakCount >= 3 && activePerks['streak_frenzy']) {
        dmgMult *= 2;
      }

      const fireCount = (streakCount >= 3 && activePerks['streak_frenzy']) ? 2 : 1;

      for (let f = 0; f < fireCount; f++) {
        const angleOffset = (f === 1) ? 0.12 : (f === 0 && fireCount === 2 ? -0.12 : 0);
        const finalAngle = aimAngle + angleOffset;

        if (wp.id === 'laser') {
          sound.playLaser();
          const spd = 14 * spdMult;
          bullets.push({
            x: startX, y: startY,
            vx: Math.cos(finalAngle) * spd,
            vy: Math.sin(finalAngle) * spd,
            target: target, homing: 0.12,
            dmg: 2 * dmgMult, type: 'laser', color: isCrit ? '#FF007F' : '#00F0FF', radius: isCrit ? 5.5 : 4
          });
        } else if (wp.id === 'shotgun') {
          sound.playShotgun();
          const spd = 12 * spdMult;
          [-0.26, 0, 0.26].forEach(offset => {
            const ang = finalAngle + offset;
            bullets.push({ x: startX, y: startY, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, target: null, homing: 0, dmg: 1.5 * dmgMult, type: 'shotgun', color: '#FFD700', radius: 3.5 });
          });
        } else if (wp.id === 'sniper') {
          sound.playLaser(1100);
          const spd = 20 * spdMult;
          bullets.push({ x: startX, y: startY, vx: Math.cos(finalAngle)*spd, vy: Math.sin(finalAngle)*spd, dmg: 5 * dmgMult, type: 'sniper', color: '#FF007F', radius: 5.5, pierce: true });
        } else if (wp.id === 'plasma') {
          sound.playLaser(450);
          const spd = 11 * spdMult;
          bullets.push({ x: startX, y: startY, vx: Math.cos(finalAngle)*spd, vy: Math.sin(finalAngle)*spd, target: target, homing: 0.1, dmg: 3 * dmgMult, type: 'plasma', color: '#00FFA3', radius: 7, aoe: 65 });
        } else if (wp.id === 'chain') {
          sound.playSkill('emp');
          const spd = 14 * spdMult;
          bullets.push({ x: startX, y: startY, vx: Math.cos(finalAngle)*spd, vy: Math.sin(finalAngle)*spd, target: target, homing: 0.15, dmg: 2.5 * dmgMult, type: 'chain', color: '#38BDF8', radius: 4.5 });
        } else if (wp.id === 'missile') {
          sound.playLaser(550);
          const spd = 9 * spdMult;
          [-0.2, 0.2].forEach(offset => {
            const ang = finalAngle + offset;
            bullets.push({ x: startX, y: startY, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, target: target, homing: 0.22, dmg: 2.5 * dmgMult, type: 'missile', color: '#F97316', radius: 4.5 });
          });
        } else if (wp.id === 'freeze') {
          sound.playSkill('freeze');
          const spd = 13 * spdMult;
          bullets.push({ x: startX, y: startY, vx: Math.cos(finalAngle)*spd, vy: Math.sin(finalAngle)*spd, target: target, homing: 0.12, dmg: 2 * dmgMult, type: 'freeze', color: '#A5F3FC', radius: 6, aoe: 75 });
        } else if (wp.id === 'blackhole') {
          sound.playLaser(200);
          const spd = 9 * spdMult;
          bullets.push({ x: startX, y: startY, vx: Math.cos(finalAngle)*spd, vy: Math.sin(finalAngle)*spd, target: target, homing: 0.1, dmg: 3 * dmgMult, type: 'blackhole', color: '#C084FC', radius: 9 });
        }
      }
    }

    /* ==========================================

    /* ==========================================
       11. 🎙️ 智慧語音聲控作答引擎
       ========================================== */
    let recognition = null;
    let isVoiceActive = false;

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { voiceStatusText.textContent = '不支援'; return; }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'zh-TW';

      recognition.onstart = () => {
        isVoiceActive = true;
        voiceInputBtn.classList.add('bg-cyan-500/20', 'border-cyan-400', 'glow-cyan');
        voiceIcon.textContent = '🟢';
        voiceStatusText.textContent = '聆聽中';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        const parsedVal = parseChineseNumber(transcript);
        if (parsedVal !== null) {
          inputBuffer = parsedVal.toString();
          inputBufferText.textContent = inputBuffer;
          handleFire();
        }
      };

      recognition.onend = () => {
        if (isVoiceActive) { try { recognition.start(); } catch(e) {} }
        else { voiceIcon.textContent = '🎙️'; voiceStatusText.textContent = '語音'; }
      };
    }

    function parseChineseNumber(str) {
      const numMatch = str.match(/\d+/);
      if (numMatch) return parseInt(numMatch[0], 10);
      const chMap = { '零':0, '一':1, '二':2, '兩':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9, '十':10 };
      if (str === '十') return 10;
      if (str.includes('十')) {
        const parts = str.split('十');
        const tens = chMap[parts[0]] || 1;
        const units = chMap[parts[1]] || 0;
        return tens * 10 + units;
      }
      return chMap[str] !== undefined ? chMap[str] : null;
    }

    voiceInputBtn.addEventListener('click', () => {
      sound.init();
      if (!recognition) initSpeechRecognition();
      if (!recognition) return;
      if (!isVoiceActive) { try { recognition.start(); isVoiceActive = true; } catch(e) {} }
      else { isVoiceActive = false; recognition.stop(); voiceInputBtn.classList.remove('bg-cyan-500/20', 'border-cyan-400', 'glow-cyan'); voiceIcon.textContent = '🎙️'; voiceStatusText.textContent = '語音'; }
    });

    /* ==========================================
       12. 敵軍生成與動態事件危機
       ========================================== */
    let spawnTimer = 0;

    function spawnEnemy() {
      const cw = canvas.width / (window.devicePixelRatio || 1);
      
      // 動態戰場事件：狂暴潮（Rush Wave）期間生成大量疾行竹竿人
      let template = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
      if (activeMiniEvent === 'rush_wave' && Math.random() < 0.7) {
        template = ENEMY_TYPES[0]; // speedy
      }

      const speedMult = isAdultMode ? 1.5 : 1.0;
      const speed = template.baseSpeed * speedMult * (1 + wave * 0.05);
      const patterns = ['sine', 'bounce', 'drift'];
      const pattern = patterns[Math.floor(Math.random() * patterns.length)];

      enemies.push({
        ...template,
        x: Math.random() * (cw - 60) + 30,
        y: -20,
        vy: speed,
        vx: (Math.random() * 0.8 - 0.4),
        pattern: pattern,
        sineOffset: Math.random() * Math.PI * 2,
        currentHp: template.hp + Math.floor(wave / 4)
      });
    }

    function updateEnemies() {
      const cw = canvas.width / (window.devicePixelRatio || 1);
      const ch = canvas.height / (window.devicePixelRatio || 1);
      const slowMult = freezeActiveTime > 0 ? 0.35 : 1.0;

      // 隨機觸發動態戰場事件 (電磁風暴 / 狂暴潮)
      eventTimer++;
      if (eventTimer > 900 && !activeMiniEvent && wave >= 3) {
        activeMiniEvent = Math.random() < 0.5 ? 'emp_storm' : 'rush_wave';
        eventTimer = 0;
        const msg = activeMiniEvent === 'emp_storm' ? '⚡ 警告：電磁風暴（EMP Storm）來襲！' : '🚨 警告：敵軍狂暴潮（Rush Wave）突發！';
        showFloatingText(msg, cw / 2, 90, '#FFD700');
        generateNewQuestion();
        setTimeout(() => { activeMiniEvent = null; generateNewQuestion(); }, 15000);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const individualSlow = e.slowTimer > 0 ? 0.45 : 1.0;
        if (e.slowTimer > 0) e.slowTimer -= 1/60;

        e.y += e.vy * slowMult * individualSlow;
        if (e.pattern === 'sine') e.x += Math.sin(e.y * 0.04 + e.sineOffset) * 0.9 * slowMult;
        else if (e.pattern === 'bounce') { e.x += e.vx * slowMult; if (e.x < 20 || e.x > cw - 20) e.vx *= -1; }
        else if (e.pattern === 'drift') { e.x += (cw / 2 - e.x) * 0.005 * slowMult; }

        e.x = Math.max(16, Math.min(cw - 16, e.x));

        if (e.y >= ch - 28) {
          if (shieldHp > 0) {
            shieldHp = Math.max(0, shieldHp - 15);
            showFloatingText('SHIELD BLOCKED!', e.x, ch - 40, '#00F0FF');
          } else {
            hp -= 15;
            sound.playExplosion();
            createExplosion(e.x, e.y, '#FF007F', 12);
            if (hp <= 0) gameOver();
          }
          enemies.splice(i, 1);
          updateHUD();
        }
      }
    }

    /* ==========================================
       13. 彈道飛行、自動導引碰撞與連鎖爆炸
       ========================================== */
    function damageEnemy(enemy, dmg, hitColor) {
      enemy.currentHp -= dmg;
      createExplosion(enemy.x, enemy.y, hitColor, 5);
      if (enemy.currentHp <= 0) {
        sound.playExplosion();
        createExplosion(enemy.x, enemy.y, enemy.color, 15);

        // 晶片：連鎖爆炸
        if (activePerks['chain_boom'] && Math.random() < 0.25) {
          const hX = enemy.x, hY = enemy.y;
          createExplosion(hX, hY, '#FFD700', 25);
          enemies.forEach(other => {
            if (other !== enemy && Math.hypot(other.x - hX, other.y - hY) <= 80) {
              damageEnemy(other, 2, '#FFD700');
            }
          });
        }

        if (enemy.type === 'splitter' && !enemy.isMini) {
          for (let k = -1; k <= 1; k += 2) {
            enemies.push({
              type: 'mini', name: '分裂幼蟲', size: 5.5, hp: 1, currentHp: 1,
              x: enemy.x + k * 12, y: enemy.y, vy: enemy.vy * 1.25, vx: k * 0.6,
              pattern: 'bounce', sineOffset: 0, color: '#FB923C', icon: '🦠', isMini: true
            });
          }
        }
        const idx = enemies.indexOf(enemy);
        if (idx !== -1) enemies.splice(idx, 1);
        totalKills++;
        gold += 3;
        updateHUD();
      }
    }

    function updateBullets() {
      const cw = canvas.width / (window.devicePixelRatio || 1);
      const ch = canvas.height / (window.devicePixelRatio || 1);

      for (let i = blackHoles.length - 1; i >= 0; i--) {
        const bh = blackHoles[i];
        bh.timer -= 1/60;
        enemies.forEach(e => {
          const dx = bh.x - e.x, dy = bh.y - e.y, dist = Math.hypot(dx, dy);
          if (dist < 110 && dist > 5) {
            e.x += (dx / dist) * 1.8; e.y += (dy / dist) * 1.8;
            if (Math.random() < 0.08) damageEnemy(e, 0.4 * getAttackStats().multiplier, '#C084FC');
          }
        });
        if (bh.timer <= 0) blackHoles.splice(i, 1);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.homing && enemies.length > 0) {
          if (!b.target || !enemies.includes(b.target)) b.target = getPrimaryTarget(b.x, b.y);
          if (b.target) {
            const spd = Math.hypot(b.vx, b.vy);
            const desiredAngle = Math.atan2(b.target.y - b.y, b.target.x - b.x);
            const currentAngle = Math.atan2(b.vy, b.vx);
            let diff = desiredAngle - currentAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const newAngle = currentAngle + diff * b.homing;
            b.vx = Math.cos(newAngle) * spd; b.vy = Math.sin(newAngle) * spd;
          }
        }

        b.x += b.vx; b.y += b.vy;

        if (b.y < -30 || b.y > ch + 30 || b.x < -30 || b.x > cw + 30) {
          bullets.splice(i, 1); continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (!e) continue;
          if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.size + 4) {
            const hitX = e.x, hitY = e.y;
            damageEnemy(e, b.dmg || 1, b.color);

            if (b.type === 'plasma') {
              createExplosion(hitX, hitY, '#00FFA3', 20);
              enemies.slice().forEach(other => {
                if (other !== e && Math.hypot(other.x - hitX, other.y - hitY) <= (b.aoe || 65)) damageEnemy(other, (b.dmg || 2) * 0.7, '#00FFA3');
              });
            }
            if (b.type === 'freeze') {
              createExplosion(hitX, hitY, '#A5F3FC', 16);
              enemies.forEach(other => { if (Math.hypot(other.x - hitX, other.y - hitY) <= (b.aoe || 75)) other.slowTimer = 4.0; });
            }
            if (b.type === 'chain') {
              let lastX = hitX, lastY = hitY;
              enemies.filter(o => o !== e).slice(0, 3).forEach(targetE => {
                lightningBolts.push({ x1: lastX, y1: lastY, x2: targetE.x, y2: targetE.y, alpha: 1.0 });
                lastX = targetE.x; lastY = targetE.y;
                damageEnemy(targetE, (b.dmg || 2) * 0.75, '#38BDF8');
              });
            }
            if (b.type === 'blackhole') { blackHoles.push({ x: hitX, y: hitY, timer: 3.0 }); }

            if (!b.pierce) { bullets.splice(i, 1); break; }
          }
        }
      }
    }

    function createExplosion(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2, spd = Math.random() * 3 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, color, alpha: 1.0, radius: Math.random() * 2 + 1 });
      }
    }

    function showFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, color, alpha: 1.0 });
    }

    /* ==========================================
       14. 畫布渲染迴圈
       ========================================== */
    function gameLoop() {
      if (!isRunning) return;

      const cw = canvas.width / (window.devicePixelRatio || 1);
      const ch = canvas.height / (window.devicePixelRatio || 1);
      ctx.clearRect(0, 0, cw, ch);

      const startX = cw / 2;
      const startY = ch - 20;

      spawnTimer++;
      const spawnInterval = activeMiniEvent === 'rush_wave' ? 35 : Math.max(70, 180 - wave * 10);
      if (spawnTimer >= spawnInterval) {
        spawnEnemy();
        spawnTimer = 0;
      }
      updateEnemies();
      updateBullets();

      if (freezeCd > 0) { freezeCd = Math.max(0, freezeCd - 1/60); freezeCdOverlay.classList.remove('hidden'); freezeCdOverlay.classList.add('flex'); freezeCdOverlay.textContent = `${Math.ceil(freezeCd)}s`; }
      else { freezeCdOverlay.classList.add('hidden'); freezeCdOverlay.classList.remove('flex'); }
      if (empCd > 0) { empCd = Math.max(0, empCd - 1/60); empCdOverlay.classList.remove('hidden'); empCdOverlay.classList.add('flex'); empCdOverlay.textContent = `${Math.ceil(empCd)}s`; }
      else { empCdOverlay.classList.add('hidden'); empCdOverlay.classList.remove('flex'); }
      if (freezeActiveTime > 0) freezeActiveTime -= 1/60;

      blackHoles.forEach(bh => {
        ctx.save();
        ctx.beginPath(); ctx.arc(bh.x, bh.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(88, 28, 135, 0.55)'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#C084FC'; ctx.stroke();
        ctx.restore();
      });

      const lockedTarget = getPrimaryTarget(startX, startY);
      if (lockedTarget) {
        const desiredAngle = Math.atan2(lockedTarget.y - startY, lockedTarget.x - startX);
        turretAngle += (desiredAngle - turretAngle) * 0.2;
      } else {
        turretAngle += (-Math.PI / 2 - turretAngle) * 0.1;
      }

      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e === lockedTarget) {
          ctx.strokeStyle = 'rgba(255, 0, 127, 0.85)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(0, 0, e.size + 6, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = e.slowTimer > 0 ? '#38BDF8' : e.color;
        ctx.beginPath(); ctx.arc(0, 0, e.size, 0, Math.PI * 2); ctx.fill();

        const barW = e.size * 2;
        ctx.fillStyle = '#1e293b'; ctx.fillRect(-barW / 2, -e.size - 6, barW, 2.5);
        ctx.fillStyle = e === lockedTarget ? '#FF007F' : '#00F0FF';
        ctx.fillRect(-barW / 2, -e.size - 6, Math.max(0, (e.currentHp / e.hp) * barW), 2.5);

        ctx.font = `${Math.floor(e.size * 1.3)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(e.icon, 0, 0);
        ctx.restore();
      });

      // 砲塔繪製
      ctx.save();
      ctx.translate(startX, startY); ctx.rotate(turretAngle);
      ctx.fillStyle = '#00F0FF'; ctx.fillRect(0, -3.5, 22, 7);
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(startX, startY, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#00F0FF'; ctx.stroke();
      ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🧠', startX, startY);
      ctx.restore();

      bullets.forEach(b => {
        ctx.save(); ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });

      for (let i = lightningBolts.length - 1; i >= 0; i--) {
        const lb = lightningBolts[i]; lb.alpha -= 0.08;
        if (lb.alpha <= 0) { lightningBolts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = lb.alpha; ctx.strokeStyle = '#38BDF8'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(lb.x1, lb.y1); ctx.lineTo(lb.x2, lb.y2); ctx.stroke();
        ctx.restore();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.025;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const f = floatingTexts[i]; f.y -= 0.8; f.alpha -= 0.02;
        if (f.alpha <= 0) { floatingTexts.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = f.alpha; ctx.fillStyle = f.color;
        ctx.font = 'bold 16px Orbitron, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
        ctx.restore();
      }

      requestAnimationFrame(gameLoop);
    }

    function updateHUD() {
      const displayHp = shieldHp > 0 ? `${hp} (+${shieldHp}盾)` : hp;
      hpText.textContent = `${displayHp}/${maxHp}`;
      hpBarFill.style.width = `${Math.max(0, (hp / maxHp) * 100)}%`;
      waveNumText.textContent = wave;
      goldText.textContent = gold;
      synapseText.textContent = synapse;
      if (atkBonusText) {
        const atkStats = getAttackStats();
        atkBonusText.textContent = `+${atkStats.totalBonusPct}%`;
      }
    }

    function gameOver() {
      isRunning = false; bgm.stop();
      document.getElementById('final-wave').textContent = wave;
      document.getElementById('final-kills').textContent = totalKills;
      document.getElementById('final-correct').textContent = totalCorrect;
      document.getElementById('final-synapse').textContent = synapse;
      gameOverOverlay.classList.remove('hidden'); gameOverOverlay.classList.add('flex');
    }

    /* ==========================================
       15. 遊戲啟動與鍵盤監聽
       ========================================== */
    function startGame(layoutMode) {
      sound.init();
      bgm.init(sound.ctx);
      bgm.start();
      
      setLayoutMode(layoutMode);
      startScreenOverlay.classList.add('hidden');
      
      hp = 100; maxHp = 100; shieldHp = 0;
      wave = 1; gold = 0; synapse = 0;
      totalKills = 0; totalCorrect = 0; streakCount = 0;
      enemies = []; bullets = []; particles = []; blackHoles = []; lightningBolts = [];
      WEAPONS.forEach((w, idx) => { w.unlocked = (idx === 0); });
      TECHS.forEach(t => { t.level = 0; });
      activePerks = {};
      currentWeaponId = 'laser';
      
      updateHUD();
      generateNewQuestion();
      renderWeaponsBar();
      
      isRunning = true;
      requestAnimationFrame(gameLoop);
    }

    startMobileBtn.addEventListener('click', () => startGame('mobile'));
    startDesktopBtn.addEventListener('click', () => startGame('desktop'));

    restartGameBtn.addEventListener('click', () => {
      gameOverOverlay.classList.remove('flex'); gameOverOverlay.classList.add('hidden');
      startGame(currentLayoutMode);
    });

    document.querySelectorAll('.num-key').forEach(btn => {
      btn.addEventListener('click', () => handleNumInput(btn.dataset.num));
    });

    backspaceBtn.addEventListener('click', handleBackspace);
    fireActionBtn.addEventListener('click', handleFire);
    mobileBackspaceBtn.addEventListener('click', handleBackspace);
    mobileFireBtn.addEventListener('click', handleFire);

    window.addEventListener('keydown', (e) => {
      if (!isRunning) return;
      if (e.key >= '0' && e.key <= '9') handleNumInput(e.key);
      if (e.key === 'Backspace') handleBackspace();
      if (e.key === 'Enter') handleFire();
      if (e.code === 'Space') { e.preventDefault(); triggerFreezeSkill(); }
      if (e.key === 'e' || e.key === 'E') triggerEmpSkill();
    });

    function triggerFreezeSkill() {
      if (freezeCd <= 0) { sound.playSkill('freeze'); freezeCd = 12; freezeActiveTime = 4; showFloatingText('TIME FROZEN!', canvas.width/(2*(window.devicePixelRatio||1)), 150, '#00F0FF'); }
    }
    function triggerEmpSkill() {
      if (empCd <= 0) { sound.playSkill('emp'); empCd = 20; enemies.forEach(e => createExplosion(e.x, e.y, '#FFD700', 10)); enemies = []; showFloatingText('GLOBAL EMP CLEAR!', canvas.width/(2*(window.devicePixelRatio||1)), 150, '#FFD700'); }
    }

    skillFreezeBtn.addEventListener('click', triggerFreezeSkill);
    skillEmpBtn.addEventListener('click', triggerEmpSkill);

    bgmToggleBtn.addEventListener('click', () => {
      sound.init();
      if (bgm.isPlaying) { bgm.stop(); bgmIcon.textContent = '🔇'; bgmBtnText.textContent = 'OFF'; }
      else { bgm.start(); bgmIcon.textContent = '🎵'; bgmBtnText.textContent = 'ON'; }
    });

    topFullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
    });

    function renderTechModal() {
      techListContainer.innerHTML = '';
      TECHS.forEach(t => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl';
        const isMax = t.level >= t.max;
        row.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="text-xl">${t.icon}</span>
            <div>
              <div class="text-xs font-bold text-cyan-300 font-hud">${t.name} <span class="text-amber-400">Lv.${t.level}/${t.max}</span></div>
              <div class="text-[11px] text-slate-400">${t.desc}</div>
            </div>
          </div>
          <button class="px-3 py-1.5 rounded-lg font-hud text-xs font-bold transition ${isMax ? 'bg-slate-800 text-slate-500' : 'bg-cyan-600 hover:bg-cyan-500 text-white'}" ${isMax ? 'disabled' : ''}>
            ${isMax ? 'MAX' : `🧠 ${t.cost}`}
          </button>
        `;
        const btn = row.querySelector('button');
        if (!isMax) {
          btn.addEventListener('click', () => {
            sound.init();
            if (synapse >= t.cost) {
              synapse -= t.cost; t.level++;
              if (t.id === 'max_hp') { maxHp += 25; hp = maxHp; }
              sound.playCorrect(); updateHUD(); renderTechModal();
            } else { sound.playWrong(); }
          });
        }
        techListContainer.appendChild(row);
      });
    }

    function renderShopModal() {
      const atkStats = getAttackStats();
      if (shopPassiveBanner) {
        shopPassiveBanner.innerHTML = `
          <div class="flex items-center justify-between text-cyan-300 font-bold">
            <span>🔫 槍枝收藏加成 (+10%/把)：已多購 ${atkStats.extraGuns} 把</span>
            <span class="font-math text-emerald-300">+${atkStats.gunBonusPct}% 攻擊</span>
          </div>
          <div class="flex items-center justify-between ${atkStats.allUnlocked ? 'text-amber-300 font-bold' : 'text-slate-500'}">
            <span>🪙 財富增幅 (每100元+5%)：${atkStats.allUnlocked ? `已啟動 (${gold}元)` : `未啟動`}</span>
            <span class="font-math ${atkStats.allUnlocked ? 'text-amber-300' : 'text-slate-500'}">+${atkStats.goldBonusPct}% 攻擊</span>
          </div>
          <div class="border-t border-slate-800 pt-1 mt-0.5 flex items-center justify-between text-rose-300 font-bold">
            <span>⚔️ 總攻擊力加成：</span>
            <span class="font-math text-sm">+${atkStats.totalBonusPct}% (x${atkStats.multiplier.toFixed(2)})</span>
          </div>
        `;
      }

      shopListContainer.innerHTML = '';
      WEAPONS.forEach(w => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl';
        const isEquipped = currentWeaponId === w.id;
        row.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="text-xl">${w.icon}</span>
            <div>
              <div class="text-xs font-bold text-purple-300 font-hud">${w.name}</div>
              <div class="text-[11px] text-slate-400">${w.desc}</div>
            </div>
          </div>
          <button class="px-3 py-1.5 rounded-lg font-hud text-xs font-bold transition ${isEquipped ? 'bg-emerald-600 text-white' : (w.unlocked ? 'bg-cyan-700 hover:bg-cyan-600 text-white' : 'bg-amber-600 hover:bg-amber-500 text-white')}">
            ${isEquipped ? '裝備中' : (w.unlocked ? '裝備' : `🪙 ${w.cost}`)}
          </button>
        `;
        const btn = row.querySelector('button');
        btn.addEventListener('click', () => {
          sound.init();
          if (w.unlocked) { currentWeaponId = w.id; renderWeaponsBar(); renderShopModal(); }
          else if (gold >= w.cost) {
            gold -= w.cost; w.unlocked = true; currentWeaponId = w.id;
            sound.playCorrect(); updateHUD(); renderWeaponsBar(); renderShopModal();
          } else { sound.playWrong(); }
        });
        shopListContainer.appendChild(row);
      });
    }

    openTechBtn.addEventListener('click', () => { sound.init(); renderTechModal(); techModalOverlay.classList.remove('hidden'); techModalOverlay.classList.add('flex'); });
    closeTechBtn.addEventListener('click', () => { techModalOverlay.classList.add('hidden'); techModalOverlay.classList.remove('flex'); });
    openShopBtn.addEventListener('click', () => { sound.init(); renderShopModal(); shopModalOverlay.classList.remove('hidden'); shopModalOverlay.classList.add('flex'); });
    closeShopBtn.addEventListener('click', () => { shopModalOverlay.classList.add('hidden'); shopModalOverlay.classList.remove('flex'); });

    function renderWeaponsBar() {
      weaponBar.innerHTML = '';
      WEAPONS.forEach(w => {
        const btn = document.createElement('button');
        btn.className = `px-2 py-1 rounded-lg text-xs font-hud font-bold flex items-center gap-1 border transition ${w.id === currentWeaponId ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200 glow-cyan' : 'bg-slate-900 border-slate-800 text-slate-400'}`;
        btn.innerHTML = `<span>${w.icon}</span><span class="text-[10px] hidden sm:inline">${w.name}</span>`;
        btn.addEventListener('click', () => {
          sound.init();
          if (w.unlocked) { currentWeaponId = w.id; renderWeaponsBar(); }
          else { showFloatingText(`需要 ${w.cost} 🪙`, canvas.width/(2*(window.devicePixelRatio||1)), canvas.height/(2*(window.devicePixelRatio||1)-100), '#F87171'); }
        });
        weaponBar.appendChild(btn);
      });
    }

    window.onload = function() {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      setupDrawer();
      resizeCanvas();
    };
  </script>
</body>
</html>
